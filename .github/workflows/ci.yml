name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test the command line
        run: go test -timeout 30m ./...
      - name: Test the Odoo core
        working-directory: third_party/packages/odoo
        run: go test -timeout 30m ./...
      - name: Compile the conformance tooling
        run: python3 -m py_compile conformance/*.py conformance/upgrade-check/*.py conformance/packs/*.py conformance/packs/salon_demo/*.py conformance/packs/salon_demo/models/*.py
