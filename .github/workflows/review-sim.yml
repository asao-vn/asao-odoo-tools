name: review-sim

# The review checks, measured on a simulated business: a throwaway Odoo 19 with the Vietnamese chart holds
# months of a simulated company written through Odoo's own flows, with planted errors and frauds and
# look-alikes that must not be flagged. odoo-cli review run reads it through the API, and score.py sets
# its findings against the truth. The same script runs on any machine with Docker or Podman:
# conformance/review-sim/run.sh --out /tmp/review-sim

on:
  # Weekly: the 12-month trader with everyday noise and the held-out set, on a new seed each week, so a check
  # that holds only on one draw of the business fails where its owners see it (DEC-2026-0181).
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:
    inputs:
      months:
        description: Months of business, ending with September 2026.
        default: "6"
      scale:
        description: How many times the regular sales.
        default: "1"
      mess:
        description: Add a real shop's everyday noise (returns, part payments, discounts, a clearance week, cancellations).
        type: boolean
        default: false
      profile:
        description: The shape of the everyday sales (trader, retail, service).
        default: trader
      fresh:
        description: Add the held-out set (needs 12 months or more).
        type: boolean
        default: false
      seed:
        description: The seed of the everyday business (default 20261014).
        default: "20261014"
      real_sales:
        description: Add real sales of a UK online retailer (UCI Online Retail II, CC BY 4.0), nothing planted in them.
        type: boolean
        default: false
      real_seed:
        description: Which customers of the real sales to take (a seeded sample).
        default: "1"
      real_spend:
        description: Add real card transactions and supplier payments of Birmingham City Council (OGL v3.0), nothing planted in them.
        type: boolean
        default: false
      real_spend_seed:
        description: Which cardholders and suppliers of the real spending to take (a seeded sample).
        default: "3"

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build odoo-cli
        run: go build -o "$RUNNER_TEMP/odoo-cli" ./cmd/odoo-cli
      - name: Fetch and sample the real sales (UCI Online Retail II, CC BY 4.0)
        if: inputs.real_sales
        run: |
          mkdir -p "$RUNNER_TEMP/uci"
          curl -sSL -o "$RUNNER_TEMP/uci/online_retail_ii.zip" "https://archive.ics.uci.edu/static/public/502/online+retail+ii.zip"
          echo "572e36277c2390fbfde10664750731e0a86f55e33470d91919085f0408e67bfb  $RUNNER_TEMP/uci/online_retail_ii.zip" | sha256sum -c -
          python3 -I -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extract('online_retail_II.xlsx', sys.argv[2])" "$RUNNER_TEMP/uci/online_retail_ii.zip" "$RUNNER_TEMP/uci"
          python3 -I conformance/review-sim/prepare_uci.py --xlsx "$RUNNER_TEMP/uci/online_retail_II.xlsx" --out "$RUNNER_TEMP/uci-sales.json" --seed "${{ inputs.real_seed }}"
          echo "REAL_SALES=$RUNNER_TEMP/uci-sales.json" >> "$GITHUB_ENV"
      - name: Fetch and sample the real spending (Birmingham City Council, OGL v3.0)
        if: inputs.real_spend
        run: |
          # The portal is live and corrected over time: no fixed checksum, prepare_birmingham.py records each file's sha256.
          B=https://www.cityobservatory.birmingham.gov.uk/api/explore/v2.1/catalog/datasets
          mkdir -p "$RUNNER_TEMP/bhm"
          curl -sSfL -o "$RUNNER_TEMP/bhm/cards.csv" "$B/purchase-card-transactions/exports/csv?delimiter=%2C&where=trans_date%3E%3Ddate%272024-10-01%27%20and%20trans_date%3Cdate%272025-10-01%27"
          curl -sSfL -o "$RUNNER_TEMP/bhm/payments.csv" "$B/payments-to-suppliers-over-gbp500/exports/csv?delimiter=%2C&where=date%3E%3Ddate%272024-10-01%27%20and%20date%3Cdate%272025-10-01%27"
          python3 -I conformance/review-sim/prepare_birmingham.py --cards "$RUNNER_TEMP/bhm/cards.csv" --payments "$RUNNER_TEMP/bhm/payments.csv" --out "$RUNNER_TEMP/bhm-spend.json" --seed "${{ inputs.real_spend_seed }}"
          echo "REAL_SPEND=$RUNNER_TEMP/bhm-spend.json" >> "$GITHUB_ENV"
      - name: Simulate the business, review it, score the review
        env:
          SIM_MONTHS: ${{ github.event_name == 'schedule' && '12' || inputs.months }}
          SIM_SCALE: ${{ github.event_name == 'schedule' && '1' || inputs.scale }}
          SIM_MESS: ${{ (github.event_name == 'schedule' || inputs.mess) && '1' || '' }}
          SIM_PROFILE: ${{ github.event_name == 'schedule' && 'trader' || inputs.profile }}
          SIM_FRESH: ${{ (github.event_name == 'schedule' || inputs.fresh) && '1' || '' }}
          SIM_SEED: ${{ github.event_name == 'schedule' && github.run_number || inputs.seed }}
        run: conformance/review-sim/run.sh --out "$RUNNER_TEMP/review-sim" --engine docker --odoo-bin "$RUNNER_TEMP/odoo-cli"
      - name: Summary
        if: always()
        run: cat "$RUNNER_TEMP/review-sim/summary.md" >> "$GITHUB_STEP_SUMMARY" || echo "The simulation stopped before its score; see the logs." >> "$GITHUB_STEP_SUMMARY"
      - name: Pack the evidence (never the lab's secrets)
        if: always()
        run: |
          cd "$RUNNER_TEMP/review-sim"
          tar czf "$RUNNER_TEMP/review-sim.tar.gz" --exclude=secret --exclude=xdg --exclude=odoo-cli .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-sim
          path: ${{ runner.temp }}/review-sim.tar.gz
