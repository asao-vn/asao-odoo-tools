syntax = "proto3";

package identity.v1;

option go_package = "github.com/asao-platform/atoc/packages/proto/identity/v1;identityv1";

service IdentityService {
  rpc ValidateToken (ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc GetUser (GetUserRequest) returns (GetUserResponse);
  rpc CheckPermission (CheckPermissionRequest) returns (CheckPermissionResponse);
  rpc AuthenticateStaffWithGoogle (AuthenticateStaffWithGoogleRequest) returns (AuthenticateStaffWithGoogleResponse);
  rpc AuthenticateStaffWithKeycloak (AuthenticateStaffWithKeycloakRequest) returns (AuthenticateStaffWithKeycloakResponse);
  rpc RefreshToken (RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc RevokeToken (RevokeTokenRequest) returns (RevokeTokenResponse);
  rpc BootstrapAsaoUser (BootstrapAsaoUserRequest) returns (BootstrapAsaoUserResponse);
  rpc ProvisionOwnerStaff (ProvisionOwnerStaffRequest) returns (ProvisionOwnerStaffResponse);
  rpc ProvisionInvitedStaff (ProvisionInvitedStaffRequest) returns (ProvisionInvitedStaffResponse);
  rpc ResolveStaffElevation (ResolveStaffElevationRequest) returns (ResolveStaffElevationResponse);

  // Role & permission model (P0-2 of the two-portal identity/access model).
  rpc CreateOrgRole (CreateOrgRoleRequest) returns (OrgRoleResponse);
  rpc UpdateOrgRolePermissions (UpdateOrgRolePermissionsRequest) returns (OrgRoleResponse);
  rpc ListOrgRoles (ListOrgRolesRequest) returns (ListOrgRolesResponse);
  rpc GetStaffAccess (GetStaffAccessRequest) returns (GetStaffAccessResponse);
}

message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  string user_id = 2;
  string user_type = 3;
  string organization_id = 4;
  string session_class = 5;
  string role = 6;
}

message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  string user_id = 1;
  string user_type = 2;
  string organization_id = 3;
}

message CheckPermissionRequest {
  string user_id = 1;
  string permission = 2;
  string organization_id = 3;
  string user_type = 4;
  string resource_type = 5;
  string resource_id = 6;
  string correlation_id = 7;
}

message CheckPermissionResponse {
  bool allowed = 1;
  string reason_code = 2;
}

message AuthenticateStaffWithGoogleRequest {
  string organization_id = 1;
  string google_id_token = 2;
  string correlation_id = 3;
  string causation_id = 4;
}

message AuthenticateStaffWithGoogleResponse {
  string user_id = 1;
  string user_type = 2;
  string organization_id = 3;
  string access_token = 4;
  bool created = 5;
  string refresh_token = 6;
  int64 access_token_expires_at = 7;
  int64 refresh_token_expires_at = 8;
}

message AuthenticateStaffWithKeycloakRequest {
  string organization_id = 1;
  string asao_user_id = 2;
  string correlation_id = 3;
  string causation_id = 4;
}

message AuthenticateStaffWithKeycloakResponse {
  string user_id = 1;
  string user_type = 2;
  string organization_id = 3;
  string access_token = 4;
  bool created = 5;
  string refresh_token = 6;
  int64 access_token_expires_at = 7;
  int64 refresh_token_expires_at = 8;
}

message RefreshTokenRequest {
  string organization_id = 1;
  string refresh_token = 2;
  string correlation_id = 3;
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
  int32 expires_in_seconds = 3;
}

message RevokeTokenRequest {
  string organization_id = 1;
  string refresh_token = 2;
  string correlation_id = 3;
}

message RevokeTokenResponse {
  bool success = 1;
}

message BootstrapAsaoUserRequest {
  string provider_type = 1;          // "keycloak"
  string provider_issuer = 2;        // exact iss string, unmodified
  string provider_subject = 3;       // keycloak sub
  string normalized_identifier = 4;  // lowercased email — lookup hint only, never identity key
  bool email_verified = 5;
  string correlation_id = 6;
  string causation_id = 7;
}

message BootstrapAsaoUserResponse {
  string asao_user_id = 1;
  bool is_new = 2;
  string access_token = 3;
}

message ProvisionOwnerStaffRequest {
  string organization_id = 1;
  string asao_user_id = 2;
  string correlation_id = 3;
  string causation_id = 4;
}

message ProvisionOwnerStaffResponse {
  string staff_id = 1;
  bool created = 2;
}

message ProvisionInvitedStaffRequest {
  string organization_id = 1;
  string email = 2;
  string full_name = 3;
  string role_key = 4;
  string correlation_id = 5;
  string causation_id = 6;
  // branch_id and default_surface are additive/optional: omit to leave the
  // staff member organization-wide with the default "dashboard" surface.
  string branch_id = 7;
  string default_surface = 8;
}

message ProvisionInvitedStaffResponse {
  string staff_id = 1;
}

message ResolveStaffElevationRequest {
  string asao_user_id = 1;
  string email = 2;
}

message ResolveStaffElevationResponse {
  string organization_id = 1;
  string staff_id = 2;
}

// ---- Role & permission model (P0-2) ----

message CreateOrgRoleRequest {
  string organization_id = 1;
  string key = 2;                        // 2-32 lowercase letters/underscores
  string name = 3;
  repeated string permission_keys = 4;
  string correlation_id = 5;
}

message UpdateOrgRolePermissionsRequest {
  string organization_id = 1;
  string role_key = 2;
  repeated string permission_keys = 3;   // replaces the role's full permission set
  string correlation_id = 4;
}

message OrgRoleResponse {
  string role_id = 1;
  string organization_id = 2;
  string key = 3;
  string name = 4;
  string description = 5;
  bool system_managed = 6;
  repeated string permission_keys = 7;
}

message ListOrgRolesRequest {
  string organization_id = 1;
}

message ListOrgRolesResponse {
  repeated OrgRoleResponse roles = 1;
}

message GetStaffAccessRequest {
  string asao_user_id = 1;
  string organization_id = 2;
}

message GetStaffAccessResponse {
  repeated string role_keys = 1;
  repeated string permission_keys = 2;   // union of permissions across all active roles
  string branch_id = 3;
  string default_surface = 4;
}

