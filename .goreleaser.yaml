version: 2
project_name: odoo-cli
before:
  hooks:
    - go test ./...
builds:
  - id: odoo-cli
    main: ./cmd/odoo-cli
    binary: odoo-cli
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/asao-platform/atoc/packages/cli/internal/standalone.buildCommit={{ .ShortCommit }}
      - -X github.com/asao-platform/atoc/packages/cli/internal/standalone.buildDate={{ .Date }}
      - -X github.com/asao-platform/atoc/packages/cli/internal/standalone.releaseVersion={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
archives:
  # Bare binaries, as the installer downloads them: odoo-cli_<os>_<arch>[.exe].
  - formats: [binary]
    name_template: "{{ .Binary }}_{{ .Os }}_{{ .Arch }}"
checksum:
  name_template: checksums.txt
changelog:
  disable: true
release:
  footer: |
    Install: `curl -fsSL https://raw.githubusercontent.com/asao-vn/asao-odoo-tools/main/scripts/install.sh | sh`
